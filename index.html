<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RNN Translator</title>
<style>
  :root {
    --bg: #fafaf9;
    --surface: #ffffff;
    --border: #ececec;
    --border-strong: #d8d8d8;
    --text: #1c1c1f;
    --text-muted: #6b6b72;
    --text-faint: #a0a0a8;
    --accent: #ff6b35;
    --accent-soft: #fff1eb;
    --ok: #2f9d5d;
    --err: #d04545;
    --warn: #c98a14;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Nav ---------- */
  .nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 28px;
    display: flex;
    align-items: center;
    gap: 22px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    font-size: 15px;
  }

  .brand-mark {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    background: var(--text);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
  }

  .nav-tabs {
    display: flex;
    gap: 4px;
    margin-left: 8px;
  }

  .nav-tab {
    padding: 6px 12px;
    border-radius: 6px;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 14px;
    border: none;
    background: transparent;
    font-family: inherit;
  }
  .nav-tab:hover { color: var(--text); background: #f3f3f1; }
  .nav-tab.is-active { color: var(--text); background: #ededeb; font-weight: 500; }

  .nav-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 10px;
    border-radius: 999px;
    background: #f3f3f1;
    color: var(--text-muted);
    font-size: 12px;
    font-family: var(--mono);
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-faint);
  }
  .status-pill[data-state="ok"]  .status-dot { background: var(--ok);  box-shadow: 0 0 0 3px rgba(47,157,93,0.15); }
  .status-pill[data-state="err"] .status-dot { background: var(--err); box-shadow: 0 0 0 3px rgba(208,69,69,0.15); }
  .status-pill[data-state="loading"] .status-dot { background: var(--warn); animation: pulse 1s ease-in-out infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .model-label { color: var(--text-muted); font-size: 13px; }

  .model-select-wrap { position: relative; }
  .model-select {
    background: #f7f7f5;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 6px 28px 6px 12px;
    font-size: 13px;
    font-family: var(--mono);
    cursor: pointer;
    appearance: none;
    min-width: 220px;
  }
  .model-select:disabled { color: var(--text-faint); cursor: not-allowed; }
  .model-select-wrap::after {
    content: "";
    position: absolute;
    right: 11px; top: 50%;
    width: 6px; height: 6px;
    border-right: 1.5px solid var(--text-muted);
    border-bottom: 1.5px solid var(--text-muted);
    transform: translateY(-70%) rotate(45deg);
    pointer-events: none;
  }

  .icon-btn {
    width: 30px; height: 30px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .icon-btn:hover { background: #f3f3f1; color: var(--text); border-color: var(--border-strong); }
  .icon-btn svg { width: 15px; height: 15px; }

  /* ---------- Main ---------- */
  main { max-width: 1180px; margin: 0 auto; padding: 36px 28px 64px; }

  .banner {
    background: #fff8ec;
    border: 1px solid #f3e1b8;
    color: #6b4d0f;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13.5px;
    margin-bottom: 18px;
    display: none;
  }
  .banner.show { display: block; }
  .banner code { font-family: var(--mono); background: #f3e1b8; padding: 1px 6px; border-radius: 4px; }

  .translate-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr 1fr;
    position: relative;
    min-height: 440px;
  }

  .lang-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
  }
  .lang-header.right { justify-content: flex-end; }

  .lang-picker {
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
  }
  .lang-picker:hover { background: #f3f3f1; }

  .swap-btn {
    position: absolute;
    top: 9px;
    left: 50%;
    transform: translateX(-50%);
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 2;
  }
  .swap-btn:hover { color: var(--accent); border-color: var(--accent); }
  .swap-btn svg { width: 14px; height: 14px; }

  .pane { display: flex; flex-direction: column; min-height: 0; }
  .pane.left { border-right: 1px solid var(--border); }

  .pane-body {
    flex: 1;
    padding: 20px 22px 8px;
    position: relative;
    display: flex;
  }

  .input-area, .output-area {
    width: 100%;
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    font-family: inherit;
    font-size: 21px;
    line-height: 1.45;
    color: var(--text);
    background: transparent;
    padding: 0;
    min-height: 260px;
  }
  .input-area::placeholder { color: var(--text-faint); }

  .output-area {
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-y: auto;
  }
  .output-area.is-empty { color: var(--text-faint); }
  .output-area.is-error { color: var(--err); font-size: 14.5px; }

  .typing-caret::after {
    content: "▍";
    color: var(--accent);
    margin-left: 1px;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .pane-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 18px 14px;
    color: var(--text-faint);
    font-size: 12.5px;
  }
  .pane-footer .right-actions { display: flex; align-items: center; gap: 4px; }

  .ghost-btn {
    width: 28px; height: 28px;
    border-radius: 6px;
    background: transparent;
    border: none;
    color: var(--text-faint);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .ghost-btn:hover { background: #f3f3f1; color: var(--text); }
  .ghost-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .ghost-btn.is-active { color: var(--accent); }
  .ghost-btn svg { width: 15px; height: 15px; }

  .char-count { font-variant-numeric: tabular-nums; font-family: var(--mono); }

  .helper {
    text-align: center;
    margin-top: 20px;
    color: var(--text-muted);
    font-size: 13px;
  }
  kbd {
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 6px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--text);
  }

  .toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: #fff;
    padding: 9px 14px;
    border-radius: 8px;
    font-size: 12.5px;
    opacity: 0; pointer-events: none;
    transition: opacity 180ms ease, transform 180ms ease;
    z-index: 99;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* dropdown menu for language pick */
  .menu {
    position: absolute;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    padding: 4px;
    z-index: 50;
    min-width: 180px;
    max-height: 280px;
    overflow-y: auto;
  }
  .menu button {
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    padding: 7px 10px;
    border-radius: 5px;
    font-family: inherit;
    font-size: 13.5px;
    cursor: pointer;
    color: var(--text);
  }
  .menu button:hover { background: #f3f3f1; }
  .menu button.is-selected { background: var(--accent-soft); color: var(--accent); }

  @media (max-width: 760px) {
    .nav { flex-wrap: wrap; padding: 12px 16px; }
    .nav-right { width: 100%; }
    .model-select { min-width: 0; flex: 1; }
    main { padding: 20px 16px 48px; }
    .translate-card { grid-template-columns: 1fr; }
    .pane.left { border-right: none; border-bottom: 1px solid var(--border); }
    .swap-btn { top: auto; left: auto; right: 14px; transform: none; }
    .input-area, .output-area { font-size: 17px; min-height: 160px; }
  }
</style>
</head>
<body>
  <nav class="nav">
    <div class="brand">
      <span class="brand-mark">&gt;_</span>
      <span>RNN Translator</span>
    </div>

    <div class="nav-tabs" role="tablist">
      <button class="nav-tab is-active" role="tab">Translate</button>
      <button class="nav-tab" role="tab">Upload model</button>
      <button class="nav-tab" role="tab">Submissions</button>
    </div>

    <div class="nav-right">
      <span class="status-pill" id="statusPill" data-state="loading" title="Ollama status">
        <span class="status-dot"></span>
        <span id="statusText">connecting</span>
      </span>
      <span class="model-label">Model</span>
      <div class="model-select-wrap">
        <select class="model-select" id="modelSelect" disabled>
          <option>Loading models...</option>
        </select>
      </div>
      <button class="icon-btn" id="reloadBtn" title="Reload models">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-3.5-7.1"/>
          <polyline points="21 4 21 10 15 10"/>
        </svg>
      </button>
    </div>
  </nav>

  <main>
    <div class="banner" id="banner"></div>

    <section class="translate-card">
      <button class="swap-btn" id="swapBtn" title="Swap languages">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
          <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
        </svg>
      </button>

      <div class="pane left">
        <div class="lang-header">
          <button class="lang-picker" id="srcLangBtn" data-lang="English">English</button>
        </div>
        <div class="pane-body">
          <textarea
            class="input-area"
            id="inputText"
            placeholder="Enter text"
            maxlength="5000"
            spellcheck="false"
          >Hello, how are you?</textarea>
        </div>
        <div class="pane-footer">
          <button class="ghost-btn" id="clearBtn" title="Clear">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
          <span class="char-count"><span id="charCount">19</span> / 5000</span>
        </div>
      </div>

      <div class="pane right">
        <div class="lang-header right">
          <button class="lang-picker" id="tgtLangBtn" data-lang="Uzbek">Uzbek</button>
        </div>
        <div class="pane-body">
          <div class="output-area is-empty" id="outputText">Translation will appear here</div>
        </div>
        <div class="pane-footer">
          <button class="ghost-btn" id="copyBtn" title="Copy">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
          </button>
          <span></span>
        </div>
      </div>
    </section>

    <p class="helper">
      Press <kbd>Ctrl</kbd> + <kbd>Enter</kbd> to translate immediately.
      Auto-translates after you stop typing.
    </p>
  </main>

  <div class="toast" id="toast">Copied</div>

  <script>
    // ===== Config =====
    const OLLAMA = "http://localhost:11434";
    const LANGUAGES = [
      "English", "Uzbek", "Russian", "Spanish", "French", "German",
      "Italian", "Portuguese", "Turkish", "Arabic", "Chinese",
      "Japanese", "Korean", "Hindi", "Ukrainian", "Polish",
    ];

    // ===== DOM =====
    const $ = (id) => document.getElementById(id);
    const input       = $("inputText");
    const output      = $("outputText");
    const charCount   = $("charCount");
    const clearBtn    = $("clearBtn");
    const copyBtn     = $("copyBtn");
    const swapBtn     = $("swapBtn");
    const reloadBtn   = $("reloadBtn");
    const srcLangBtn  = $("srcLangBtn");
    const tgtLangBtn  = $("tgtLangBtn");
    const modelSelect = $("modelSelect");
    const statusPill  = $("statusPill");
    const statusText  = $("statusText");
    const banner      = $("banner");
    const toast       = $("toast");

    // ===== Status & banner =====
    const setStatus = (state, label) => {
      statusPill.dataset.state = state;
      statusText.textContent = label;
    };

    const showBanner = (html) => { banner.innerHTML = html; banner.classList.add("show"); };
    const hideBanner = () => banner.classList.remove("show");

    // ===== Model list =====
    let currentAbort = null;

    async function loadModels() {
      setStatus("loading", "connecting");
      modelSelect.disabled = true;
      modelSelect.innerHTML = '<option>Loading models...</option>';

      try {
        const r = await fetch(`${OLLAMA}/api/tags`, { cache: "no-store" });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const data = await r.json();
        const models = (data.models || []).map(m => m.name).sort();

        if (models.length === 0) {
          setStatus("err", "no models");
          modelSelect.innerHTML = '<option>No models installed</option>';
          showBanner(
            `Ollama is running but no models are installed. Pull one, e.g. ` +
            `<code>ollama pull llama3.2</code>`
          );
          return;
        }

        modelSelect.innerHTML = models
          .map(name => `<option value="${name}">${name}</option>`).join("");
        modelSelect.disabled = false;
        setStatus("ok", `${models.length} model${models.length > 1 ? "s" : ""}`);
        hideBanner();
      } catch (err) {
        setStatus("err", "offline");
        modelSelect.innerHTML = '<option>Ollama unreachable</option>';
        showBanner(
          `Could not reach Ollama at <code>${OLLAMA}</code>. ` +
          `Start it with <code>ollama serve</code>. If this page is loaded via ` +
          `<code>file://</code>, also set <code>OLLAMA_ORIGINS=*</code> first ` +
          `(PowerShell: <code>$env:OLLAMA_ORIGINS="*"; ollama serve</code>).`
        );
      }
    }

    // ===== Translation =====
    async function translate() {
      const text = input.value.trim();
      if (currentAbort) { currentAbort.abort(); currentAbort = null; }
      if (!text) { renderEmpty(); return; }
      if (modelSelect.disabled || !modelSelect.value || modelSelect.value === "Ollama unreachable") {
        renderError("No model available. Check Ollama connection.");
        return;
      }

      const model = modelSelect.value;
      const src = srcLangBtn.dataset.lang;
      const tgt = tgtLangBtn.dataset.lang;

      const body = {
        model,
        stream: true,
        options: { temperature: 0.2 },
        messages: [
          {
            role: "system",
            content:
              `You are a precise translator. Translate the user's text from ${src} to ${tgt}. ` +
              `Output ONLY the translation. No quotes, no commentary, no romanization, ` +
              `no source text, no explanations.`,
          },
          { role: "user", content: text },
        ],
      };

      const ac = new AbortController();
      currentAbort = ac;

      output.classList.remove("is-empty", "is-error");
      output.textContent = "";
      output.classList.add("typing-caret");

      try {
        const r = await fetch(`${OLLAMA}/api/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
          signal: ac.signal,
        });
        if (!r.ok || !r.body) throw new Error(`HTTP ${r.status}`);

        const reader = r.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        let acc = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const lines = buf.split("\n");
          buf = lines.pop() || "";
          for (const line of lines) {
            const s = line.trim();
            if (!s) continue;
            try {
              const chunk = JSON.parse(s);
              if (chunk.message?.content) {
                acc += chunk.message.content;
                output.textContent = acc;
              }
              if (chunk.done) { /* stream end signaled */ }
            } catch { /* ignore parse blip */ }
          }
        }
        output.classList.remove("typing-caret");
        if (!acc) renderEmpty();
      } catch (err) {
        if (err.name === "AbortError") return;
        output.classList.remove("typing-caret");
        renderError(`Translation failed: ${err.message}`);
      } finally {
        if (currentAbort === ac) currentAbort = null;
      }
    }

    function renderEmpty() {
      output.classList.remove("is-error", "typing-caret");
      output.classList.add("is-empty");
      output.textContent = "Translation will appear here";
    }
    function renderError(msg) {
      output.classList.remove("is-empty", "typing-caret");
      output.classList.add("is-error");
      output.textContent = msg;
    }

    // ===== Debounced auto-translate =====
    let debounceTimer;
    const scheduleTranslate = () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(translate, 650);
    };

    // ===== Char count =====
    const updateCount = () => { charCount.textContent = input.value.length; };

    // ===== Language picker menu =====
    let openMenu = null;
    function closeMenu() {
      if (openMenu) { openMenu.remove(); openMenu = null; }
    }
    document.addEventListener("click", (e) => {
      if (openMenu && !openMenu.contains(e.target) &&
          e.target !== srcLangBtn && e.target !== tgtLangBtn) closeMenu();
    });

    function openLangMenu(btn) {
      closeMenu();
      const menu = document.createElement("div");
      menu.className = "menu";
      const rect = btn.getBoundingClientRect();
      menu.style.top = `${rect.bottom + window.scrollY + 4}px`;
      menu.style.left = `${rect.left + window.scrollX}px`;
      for (const lang of LANGUAGES) {
        const item = document.createElement("button");
        item.textContent = lang;
        if (lang === btn.dataset.lang) item.classList.add("is-selected");
        item.addEventListener("click", () => {
          btn.dataset.lang = lang;
          btn.textContent = lang;
          closeMenu();
          if (input.value.trim()) translate();
        });
        menu.appendChild(item);
      }
      document.body.appendChild(menu);
      openMenu = menu;
    }
    srcLangBtn.addEventListener("click", () => openLangMenu(srcLangBtn));
    tgtLangBtn.addEventListener("click", () => openLangMenu(tgtLangBtn));

    // ===== Wire up =====
    input.addEventListener("input", () => { updateCount(); scheduleTranslate(); });
    input.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        e.preventDefault();
        clearTimeout(debounceTimer);
        translate();
      }
    });

    clearBtn.addEventListener("click", () => {
      input.value = "";
      updateCount();
      if (currentAbort) currentAbort.abort();
      renderEmpty();
      input.focus();
    });

    const showToast = (msg) => {
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => toast.classList.remove("show"), 1400);
    };

    copyBtn.addEventListener("click", async () => {
      if (output.classList.contains("is-empty") || output.classList.contains("is-error")) return;
      const text = output.textContent;
      if (!text) return;
      try { await navigator.clipboard.writeText(text); showToast("Copied"); }
      catch { showToast("Copy failed"); }
    });

    swapBtn.addEventListener("click", () => {
      const s = srcLangBtn.dataset.lang;
      srcLangBtn.dataset.lang = tgtLangBtn.dataset.lang;
      srcLangBtn.textContent = tgtLangBtn.dataset.lang;
      tgtLangBtn.dataset.lang = s;
      tgtLangBtn.textContent = s;

      const outText =
        output.classList.contains("is-empty") || output.classList.contains("is-error")
          ? "" : output.textContent;
      input.value = outText;
      updateCount();
      if (input.value.trim()) translate(); else renderEmpty();
    });

    reloadBtn.addEventListener("click", () => {
      reloadBtn.style.transition = "transform 500ms ease";
      reloadBtn.style.transform = "rotate(360deg)";
      setTimeout(() => {
        reloadBtn.style.transition = "none";
        reloadBtn.style.transform = "rotate(0)";
      }, 550);
      loadModels();
    });

    document.querySelectorAll(".nav-tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".nav-tab").forEach((t) => t.classList.remove("is-active"));
        tab.classList.add("is-active");
      });
    });

    // ===== Boot =====
    updateCount();
